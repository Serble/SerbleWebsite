    <!-- Pre-paint guard: the stylesheet is injected by the JS graph, so without
         this the page flashes white before it lands. base.css re-declares both
         with tokens and, loading later at equal specificity, wins. Keep these
         two values in sync with --surface-sunken and --text. -->
    <style>
      html, body { background-color: #111113; color: #f4f4f5; }
    </style>
