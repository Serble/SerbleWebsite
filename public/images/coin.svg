<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-label="Serble coin">
  <title>Serble coin</title>
  <defs>
    <clipPath id="serbleCoinFace">
      <circle cx="31" cy="30" r="26" />
    </clipPath>
  </defs>

  <!-- Coin edge, offset down-right for a shallow thickness -->
  <circle cx="32.8" cy="32.6" r="26" fill="#e0820a" />

  <!-- Flat face -->
  <circle cx="31" cy="30" r="26" fill="#ffa915" />

  <!-- Flat shine stripes. Sit under the symbol so its outline stays crisp. -->
  <g clip-path="url(#serbleCoinFace)" transform="rotate(-35 31 30)" fill="#ffffff" opacity="0.65">
    <rect x="9" y="-22" width="11" height="102" />
    <rect x="23" y="-22" width="5.5" height="102" />
  </g>

  <!-- Flat power symbol: dark outline pass, then the cream face -->
  <g fill="none" stroke="#8a4a00" stroke-width="7.4" stroke-linecap="round">
    <path d="M 37.89 18.98 A 13 13 0 1 1 24.11 18.98" />
    <line x1="31" y1="14.5" x2="31" y2="27" />
  </g>
  <g fill="none" stroke="#fff1cf" stroke-width="4.2" stroke-linecap="round">
    <path d="M 37.89 18.98 A 13 13 0 1 1 24.11 18.98" />
    <line x1="31" y1="14.5" x2="31" y2="27" />
  </g>
</svg>
